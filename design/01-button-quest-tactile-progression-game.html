<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Button Quest - Find the Right One</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <meta name="view-transition" content="same-origin">
  <link rel="prefetch" href="https://p.superdesign.dev/draft/26de9a64-f743-42a0-84ea-826ee0fb6df0" as="document">
  <link rel="prefetch" href="https://p.superdesign.dev/draft/5e2d3bcc-e6c1-4fc8-9477-bde3bb9133a9" as="document">
  <link rel="prefetch" href="https://p.superdesign.dev/draft/ba927e26-dad3-476f-bbd3-02ea254c5dc3" as="document">
  <link rel="prefetch" href="https://p.superdesign.dev/draft/69fa3a3a-b0d9-4736-b7cd-43c78c200356" as="document">
  <link rel="prefetch" href="https://p.superdesign.dev/draft/9027aa5c-ba18-40a6-96ef-2c596ac165d1" as="document">
  <style>
    @import url('https://fonts.cdnfonts.com/css/satoshi');

    body {
      font-family: 'Satoshi', 'Plus Jakarta Sans', sans-serif;
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
    }

    .button-3d {
      transition: all 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      box-shadow: 0 6px 0 var(--btn-shadow), 0 12px 20px rgba(0,0,0,0.1);
    }

    .button-3d:active, .button-3d.pressed {
      transform: translateY(4px);
      box-shadow: 0 2px 0 var(--btn-shadow), 0 4px 10px rgba(0,0,0,0.15);
    }

    .button-3d.disabled {
      opacity: 0.5;
      cursor: not-allowed;
      pointer-events: none;
    }

    .button-circle {
      width: 72px;
      height: 72px;
      border-radius: 9999px;
    }

    .button-square {
      width: 68px;
      height: 68px;
      border-radius: 12px;
    }

    .button-rect {
      width: 100px;
      height: 64px;
      border-radius: 8px;
    }

    .reveal-info {
      opacity: 0;
      transform: translateY(10px);
      transition: all 0.4s ease;
      pointer-events: none;
    }

    .header-area:hover .reveal-info {
      opacity: 1;
      transform: translateY(0);
    }

    .ad-sim-overlay {
      backdrop-filter: blur(8px);
      transition: all 0.3s ease-in-out;
    }

    /* Realistic button types */
    .btn-red { --btn-shadow: #b91c1c; background: #ef4444; }
    .btn-blue { --btn-shadow: #1d4ed8; background: #3b82f6; }
    .btn-green { --btn-shadow: #15803d; background: #22c55e; }
    .btn-yellow { --btn-shadow: #a16207; background: #eab308; }
    .btn-gray { --btn-shadow: #374151; background: #6b7280; }
    .btn-pink { --btn-shadow: #be185d; background: #ec4899; }

    .grain {
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
      opacity: 0.03;
      pointer-events: none;
    }

    @keyframes floating {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }
    .floating { animation: floating 4s ease-in-out infinite; }

    @keyframes pulse-ring {
      0% { transform: scale(0.9); opacity: 0; }
      50% { opacity: 0.3; }
      100% { transform: scale(1.2); opacity: 0; }
    }
    .correct-pulse::after {
      content: '';
      position: absolute;
      inset: -10px;
      border: 4px solid #22c55e;
      border-radius: inherit;
      animation: pulse-ring 1.5s infinite;
    }

    @view-transition { navigation: auto; }
    html { background-color: white; }
    
    ::view-transition-old(main-content) {
      animation: 0.2s ease-out both fade-out;
    }
    ::view-transition-new(main-content) {
      animation: 0.2s ease-in 0.05s both fade-in;
    }
    @keyframes fade-out { from { opacity: 1; } to { opacity: 0; } }
    @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }

    .header-area { view-transition-name: header-nav; }
    .footer-nav { view-transition-name: footer-nav; }
    .main-canvas-area { view-transition-name: main-content; }
  </style>
</head>
<body class="bg-white selection:bg-black selection:text-white">
  <div class="min-h-screen bg-white relative flex flex-col">
    <!-- Grainy texture -->
    <div class="fixed inset-0 grain z-10"></div>

    <!-- Subtle Status Overlay (Reveals on Hover at Top Center) -->
    <header class="fixed top-0 left-0 right-0 z-50 flex justify-center pt-8 header-area">
       <div class="bg-white/90 px-6 py-3 rounded-full border border-gray-100 flex flex-col items-center gap-1 cursor-default reveal-info">
          <div class="flex items-center gap-4 text-sm font-medium text-gray-400">
             <span class="flex items-center gap-1"><iconify-icon icon="lucide:layers"></iconify-icon> STAGE <span id="stage-display" class="text-gray-900 font-bold">1</span></span>
             <span class="w-px h-3 bg-gray-200"></span>
             <span class="flex items-center gap-1"><iconify-icon icon="lucide:target"></iconify-icon> REMAINING <span id="remaining-display" class="text-gray-900 font-bold">1</span></span>
             <span class="w-px h-3 bg-gray-200"></span>
             <span class="flex items-center gap-1"><iconify-icon icon="lucide:battery-medium"></iconify-icon> ENERGY <span id="energy-display" class="text-gray-900 font-bold">1</span></span>
          </div>
          <div class="text-[10px] uppercase tracking-widest text-gray-400">Find the correct buttons to proceed</div>
       </div>
    </header>

    <!-- Main Interaction Canvas -->
    <main id="game-canvas" class="flex-1 flex flex-wrap content-start justify-center gap-12 p-12 lg:p-32 pt-40 overflow-y-auto z-20 main-canvas-area">
      <!-- Buttons are generated here -->
    </main>

    <!-- Ad Simulation Modal -->
    <div id="ad-modal" class="fixed inset-0 z-[60] hidden flex items-center justify-center p-4">
       <div class="absolute inset-0 bg-black/5 ad-sim-overlay"></div>
       <div class="relative bg-white w-full max-w-md p-8 rounded-[32px] shadow-2xl border border-gray-100 flex flex-col items-center text-center">
          <div class="w-16 h-16 bg-gray-50 rounded-2xl flex items-center justify-center mb-6">
             <iconify-icon icon="lucide:video" class="text-3xl text-gray-400"></iconify-icon>
          </div>
          <h3 class="text-2xl font-bold text-gray-900 mb-2">No More Free Taps</h3>
          <p class="text-gray-500 mb-8">Watch a short ad to earn <span class="font-bold text-black">3 extra attempts</span> and keep playing!</p>
          <button id="watch-ad-btn" class="w-full bg-black text-white py-4 rounded-2xl font-bold hover:bg-gray-800 transition-colors flex items-center justify-center gap-2">
             Watch Ad to Continue
             <iconify-icon icon="lucide:external-link"></iconify-icon>
          </button>
          <button id="close-ad-btn" class="mt-4 text-sm text-gray-400 hover:text-gray-600 font-medium underline underline-offset-4">
             Maybe later
          </button>
       </div>
    </div>

    <!-- Footer Info Icon (Bottom Right) -->
    <!-- Navigation Links for Flow -->
    <nav class="fixed bottom-8 left-8 z-50 flex items-center gap-2 footer-nav">
       <a id="nav-intro-link" href="https://p.superdesign.dev/draft/26de9a64-f743-42a0-84ea-826ee0fb6df0" class="w-10 h-10 bg-white border border-gray-100 rounded-full flex items-center justify-center text-gray-400 hover:text-black hover:border-black transition-all shadow-sm" title="Exit to Intro">
          <iconify-icon icon="lucide:log-out" class="rotate-180"></iconify-icon>
       </a>
       <div class="h-6 w-px bg-gray-200 mx-1"></div>
       <a id="nav-stage2-link" href="https://p.superdesign.dev/draft/5e2d3bcc-e6c1-4fc8-9477-bde3bb9133a9" class="w-10 h-10 bg-white border border-gray-100 rounded-full flex items-center justify-center text-gray-400 hover:text-black hover:border-black transition-all shadow-sm font-bold text-[10px]">S2</a>
       <a id="nav-stage3-link" href="https://p.superdesign.dev/draft/ba927e26-dad3-476f-bbd3-02ea254c5dc3" class="w-10 h-10 bg-white border border-gray-100 rounded-full flex items-center justify-center text-gray-400 hover:text-black hover:border-black transition-all shadow-sm font-bold text-[10px]">S3</a>
       <a id="nav-final-link" href="https://p.superdesign.dev/draft/9027aa5c-ba18-40a6-96ef-2c596ac165d1" class="w-10 h-10 bg-white border border-gray-100 rounded-full flex items-center justify-center text-gray-400 hover:text-black hover:border-black transition-all shadow-sm" title="Final Stage">
          <iconify-icon icon="lucide:crown"></iconify-icon>
       </a>
       <a id="nav-complete-link" href="https://p.superdesign.dev/draft/69fa3a3a-b0d9-4736-b7cd-43c78c200356" class="w-10 h-10 bg-white border border-gray-100 rounded-full flex items-center justify-center text-gray-400 hover:text-black hover:border-black transition-all shadow-sm text-green-500" title="Victory">
          <iconify-icon icon="lucide:check-circle"></iconify-icon>
       </a>
    </nav>

    <div class="fixed bottom-8 right-8 z-50 group">
       <div class="absolute bottom-full right-0 mb-4 bg-black text-white p-4 rounded-2xl w-64 opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none">
          <p class="text-xs leading-relaxed">
            A collective button quest. Everyone sees the same stage. If someone finds the last correct button, everyone returns to Stage 1. Press wisely.
          </p>
       </div>
       <button id="footer-info-btn" class="w-12 h-12 bg-white border border-gray-100 rounded-full flex items-center justify-center text-gray-400 hover:text-black hover:border-black transition-all shadow-sm">
          <iconify-icon icon="lucide:info" class="text-xl"></iconify-icon>
       </button>
    </div>
  </div>

  <script>
    const CONFIG = {
      maxStages: 5,
      buttonsPerStage: [1, 10, 50, 200, 500],
      correctPerStage: [1, 2, 5, 12, 30],
      colors: ['btn-red', 'btn-blue', 'btn-green', 'btn-yellow', 'btn-pink', 'btn-gray'],
      types: ['button-circle', 'button-square', 'button-rect']
    };

    let currentStage = 1;
    let energy = 1;
    let remainingCorrect = 1;
    let buttonsState = []; // [{ type, color, status: 'default'|'wrong'|'correct'|'taken' }]

    const canvas = document.getElementById('game-canvas');
    const adModal = document.getElementById('ad-modal');
    const stageDisplay = document.getElementById('stage-display');
    const remainingDisplay = document.getElementById('remaining-display');
    const energyDisplay = document.getElementById('energy-display');

    function initStage(stageNum) {
      currentStage = stageNum;
      energy = 1;
      const btnCount = CONFIG.buttonsPerStage[stageNum - 1] || 1000;
      remainingCorrect = CONFIG.correctPerStage[stageNum - 1] || 50;
      
      stageDisplay.textContent = currentStage;
      remainingDisplay.textContent = remainingCorrect;
      energyDisplay.textContent = energy;
      
      canvas.innerHTML = '';
      buttonsState = [];

      // Pre-determine which indices are "correct" and which are "taken by others"
      const correctIndices = new Set();
      while(correctIndices.size < remainingCorrect) {
        correctIndices.add(Math.floor(Math.random() * btnCount));
      }

      const takenIndices = new Set();
      const takenCount = Math.floor(btnCount * 0.15); // Simulate 15% already clicked by others
      while(takenIndices.size < takenCount) {
        const idx = Math.floor(Math.random() * btnCount);
        if (!correctIndices.has(idx)) takenIndices.add(idx);
      }

      for (let i = 0; i < btnCount; i++) {
        const isCorrect = correctIndices.has(i);
        const isTaken = takenIndices.has(i);
        
        const colorClass = CONFIG.colors[Math.floor(Math.random() * CONFIG.colors.length)];
        const typeClass = CONFIG.types[Math.floor(Math.random() * CONFIG.types.length)];
        
        const btn = document.createElement('button');
        btn.id = `btn-${currentStage}-${i}`;
        btn.className = `button-3d ${typeClass} ${colorClass} ${isTaken ? 'pressed opacity-40 grayscale pointer-events-none' : ''} flex items-center justify-center`;
        
        if (isTaken) {
           btn.innerHTML = '<iconify-icon icon="lucide:x" class="text-white/50"></iconify-icon>';
        }

        btn.onclick = () => handleButtonClick(i, isCorrect, btn);
        
        canvas.appendChild(btn);
        buttonsState.push({ isCorrect, isTaken, element: btn });
      }
    }

    function handleButtonClick(index, isCorrect, btnElement) {
      if (energy <= 0) {
        showAdModal();
        return;
      }

      energy--;
      energyDisplay.textContent = energy;

      if (isCorrect) {
        btnElement.classList.add('pressed', 'correct-pulse');
        btnElement.style.background = '#22c55e';
        btnElement.style.setProperty('--btn-shadow', '#15803d');
        btnElement.innerHTML = '<iconify-icon icon="lucide:check" class="text-white text-2xl"></iconify-icon>';
        btnElement.style.pointerEvents = 'none';
        
        remainingCorrect--;
        remainingDisplay.textContent = remainingCorrect;

        if (remainingCorrect <= 0) {
          setTimeout(() => {
            if (currentStage < CONFIG.maxStages) {
              alert(`Stage ${currentStage} Clear! Entering Stage ${currentStage + 1}`);
              initStage(currentStage + 1);
            } else {
              alert("Final Stage Clear! You found all the buttons. Starting over...");
              initStage(1);
            }
          }, 600);
        }
      } else {
        btnElement.classList.add('pressed', 'grayscale', 'opacity-50');
        btnElement.innerHTML = '<iconify-icon icon="lucide:slash" class="text-white/30"></iconify-icon>';
        btnElement.style.pointerEvents = 'none';
        
        // If energy ran out on a fail, show ad modal
        if (energy <= 0) {
          setTimeout(showAdModal, 400);
        }
      }
    }

    function showAdModal() {
      adModal.classList.remove('hidden');
    }

    document.getElementById('watch-ad-btn').onclick = () => {
      // Simulate ad watching
      const btn = document.getElementById('watch-ad-btn');
      btn.innerHTML = '<iconify-icon icon="lucide:loader-2" class="animate-spin"></iconify-icon> Loading...';
      btn.classList.add('pointer-events-none');

      setTimeout(() => {
        energy += 5;
        energyDisplay.textContent = energy;
        adModal.classList.add('hidden');
        btn.innerHTML = 'Watch Ad to Continue <iconify-icon icon="lucide:external-link"></iconify-icon>';
        btn.classList.remove('pointer-events-none');
      }, 2000);
    };

    document.getElementById('close-ad-btn').onclick = () => {
      adModal.classList.add('hidden');
    };

    // Start Game
    initStage(1);

    // Simulate "other users" clicking buttons every few seconds
    setInterval(() => {
       if (buttonsState.length > 0) {
          const randomIdx = Math.floor(Math.random() * buttonsState.length);
          const target = buttonsState[randomIdx];
          if (!target.isTaken && !target.isCorrect) {
             target.isTaken = true;
             target.element.classList.add('pressed', 'opacity-40', 'grayscale', 'pointer-events-none');
             target.element.innerHTML = '<iconify-icon icon="lucide:x" class="text-white/50"></iconify-icon>';
          }
       }
    }, 8000);

  </script>
</body>
</html>
