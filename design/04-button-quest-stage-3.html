<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Button Quest - Stage 3</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <meta name="view-transition" content="same-origin">
  <link rel="prefetch" href="https://p.superdesign.dev/draft/1c4531b0-1e37-4905-a6e8-2b0834917ee5" as="document">
  <link rel="prefetch" href="https://p.superdesign.dev/draft/26de9a64-f743-42a0-84ea-826ee0fb6df0" as="document">
  <link rel="prefetch" href="https://p.superdesign.dev/draft/5e2d3bcc-e6c1-4fc8-9477-bde3bb9133a9" as="document">
  <link rel="prefetch" href="https://p.superdesign.dev/draft/ba927e26-dad3-476f-bbd3-02ea254c5dc3" as="document">
  <link rel="prefetch" href="https://p.superdesign.dev/draft/69fa3a3a-b0d9-4736-b7cd-43c78c200356" as="document">
  <link rel="prefetch" href="https://p.superdesign.dev/draft/9027aa5c-ba18-40a6-96ef-2c596ac165d1" as="document">
  <style>
    @import url('https://fonts.cdnfonts.com/css/satoshi');

    html {
        background-color: #ffffff;
    }
    @view-transition { navigation: auto; }

    ::view-transition-old(header-info), ::view-transition-new(header-info) { animation: none; mix-blend-mode: normal; }
    ::view-transition-old(info-btn), ::view-transition-new(info-btn) { animation: none; mix-blend-mode: normal; }
    
    ::view-transition-old(main-content) {
        animation: 0.25s ease-out both fade-out;
    }
    ::view-transition-new(main-content) {
        animation: 0.25s ease-in 0.1s both fade-in;
    }

    @keyframes fade-out { from { opacity: 1; } to { opacity: 0; } }
    @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }

    body {
      font-family: 'Satoshi', 'Plus Jakarta Sans', sans-serif;
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
    }

    .button-3d {
      transition: all 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      box-shadow: 0 6px 0 var(--btn-shadow), 0 12px 20px rgba(0,0,0,0.1);
    }

    .button-3d:active, .button-3d.pressed {
      transform: translateY(4px);
      box-shadow: 0 2px 0 var(--btn-shadow), 0 4px 10px rgba(0,0,0,0.15);
    }

    .button-circle { width: 72px; height: 72px; border-radius: 9999px; }
    .button-square { width: 68px; height: 68px; border-radius: 12px; }
    .button-rect { width: 100px; height: 64px; border-radius: 8px; }

    .reveal-info {
      opacity: 0;
      transform: translateY(-10px);
      transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
      pointer-events: none;
    }

    .header-area:hover .reveal-info {
      opacity: 1;
      transform: translateY(0);
    }

    .btn-red { --btn-shadow: #b91c1c; background: #ef4444; }
    .btn-blue { --btn-shadow: #1d4ed8; background: #3b82f6; }
    .btn-green { --btn-shadow: #15803d; background: #22c55e; }
    .btn-yellow { --btn-shadow: #a16207; background: #eab308; }
    .btn-gray { --btn-shadow: #374151; background: #6b7280; }
    .btn-pink { --btn-shadow: #be185d; background: #ec4899; }

    .grain {
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
      opacity: 0.03;
      pointer-events: none;
    }

    @keyframes pulse-ring {
      0% { transform: scale(0.9); opacity: 0; }
      50% { opacity: 0.3; }
      100% { transform: scale(1.2); opacity: 0; }
    }
    .correct-pulse::after {
      content: '';
      position: absolute;
      inset: -10px;
      border: 4px solid #22c55e;
      border-radius: inherit;
      animation: pulse-ring 1.5s infinite;
    }
  </style>
</head>
<body>
  <div class="min-h-screen bg-white relative flex flex-col">
    <div class="fixed inset-0 grain z-10"></div>

    <!-- Persistent Header Info Area -->
    <header class="fixed top-0 left-0 right-0 z-50 flex justify-center pt-8 header-area" style="view-transition-name: header-info">
       <div class="bg-white/95 px-6 py-3 rounded-full border border-gray-100 shadow-sm flex flex-col items-center gap-1 cursor-default reveal-info">
          <div class="flex items-center gap-4 text-sm font-medium text-gray-400">
             <span class="flex items-center gap-1"><iconify-icon icon="lucide:layers"></iconify-icon> STAGE <span class="text-gray-900 font-bold">3</span></span>
             <span class="w-px h-3 bg-gray-200"></span>
             <span class="flex items-center gap-1"><iconify-icon icon="lucide:target"></iconify-icon> REMAINING <span class="text-gray-900 font-bold">4</span></span>
             <span class="w-px h-3 bg-gray-200"></span>
             <span class="flex items-center gap-1"><iconify-icon icon="lucide:battery-medium"></iconify-icon> ENERGY <span class="text-gray-900 font-bold">12</span></span>
          </div>
          <div class="text-[10px] uppercase tracking-widest text-gray-400">Multiplayer Session: Active</div>
       </div>
    </header>

    <!-- Main Stage Content -->
    <main id="game-canvas" class="flex-1 flex flex-wrap content-start justify-center gap-10 p-12 lg:p-24 pt-32 overflow-y-auto z-20" style="view-transition-name: main-content">
      <!-- Found Button (1 of 5) -->
      <button class="button-3d button-circle btn-green pressed correct-pulse flex items-center justify-center relative">
        <iconify-icon icon="lucide:check" class="text-white text-2xl"></iconify-icon>
      </button>

      <!-- Other User Taken (Simulated) -->
      <button class="button-3d button-square btn-gray pressed opacity-40 grayscale pointer-events-none flex items-center justify-center">
        <iconify-icon icon="lucide:x" class="text-white/50"></iconify-icon>
      </button>

      <!-- Active Buttons (Grid Fill) -->
      <!-- We repeat to make 50 buttons for the design stage -->
      <button class="button-3d button-rect btn-blue hover:scale-105 active:scale-95"></button>
      <button class="button-3d button-circle btn-yellow hover:scale-105 active:scale-95"></button>
      <button class="button-3d button-square btn-red hover:scale-105 active:scale-95"></button>
      <button class="button-3d button-circle btn-pink hover:scale-105 active:scale-95"></button>
      <button class="button-3d button-rect btn-gray hover:scale-105 active:scale-95"></button>
      <button class="button-3d button-square btn-blue hover:scale-105 active:scale-95"></button>
      <button class="button-3d button-rect btn-yellow hover:scale-105 active:scale-95"></button>
      
      <!-- Taken by someone else -->
      <button class="button-3d button-circle btn-red pressed opacity-40 grayscale pointer-events-none flex items-center justify-center">
        <iconify-icon icon="lucide:x" class="text-white/50"></iconify-icon>
      </button>

      <button class="button-3d button-square btn-green hover:scale-105 active:scale-95"></button>
      <button class="button-3d button-rect btn-pink hover:scale-105 active:scale-95"></button>
      <button class="button-3d button-circle btn-blue hover:scale-105 active:scale-95"></button>
      <button class="button-3d button-square btn-yellow hover:scale-105 active:scale-95"></button>
      <button class="button-3d button-rect btn-red hover:scale-105 active:scale-95"></button>
      <button class="button-3d button-circle btn-gray hover:scale-105 active:scale-95"></button>
      <button class="button-3d button-square btn-pink hover:scale-105 active:scale-95"></button>
      <button class="button-3d button-rect btn-blue hover:scale-105 active:scale-95"></button>
      <button class="button-3d button-circle btn-green hover:scale-105 active:scale-95"></button>
      <button class="button-3d button-square btn-yellow hover:scale-105 active:scale-95"></button>
      <button class="button-3d button-rect btn-red hover:scale-105 active:scale-95"></button>
      <button class="button-3d button-circle btn-pink hover:scale-105 active:scale-95"></button>
      <button class="button-3d button-square btn-gray hover:scale-105 active:scale-95"></button>
      <button class="button-3d button-rect btn-blue hover:scale-105 active:scale-95"></button>
      <button class="button-3d button-circle btn-yellow hover:scale-105 active:scale-95"></button>
      <button class="button-3d button-square btn-green hover:scale-105 active:scale-95"></button>
      <button class="button-3d button-rect btn-pink hover:scale-105 active:scale-95"></button>
      <button class="button-3d button-circle btn-red hover:scale-105 active:scale-95"></button>
      
      <!-- Another Taken -->
      <button class="button-3d button-square btn-blue pressed opacity-40 grayscale pointer-events-none flex items-center justify-center">
        <iconify-icon icon="lucide:x" class="text-white/50"></iconify-icon>
      </button>

      <button class="button-3d button-rect btn-yellow hover:scale-105 active:scale-95"></button>
      <button class="button-3d button-circle btn-gray hover:scale-105 active:scale-95"></button>
      <button class="button-3d button-square btn-pink hover:scale-105 active:scale-95"></button>
      <button class="button-3d button-rect btn-blue hover:scale-105 active:scale-95"></button>
      <button class="button-3d button-circle btn-green hover:scale-105 active:scale-95"></button>
      <button class="button-3d button-square btn-red hover:scale-105 active:scale-95"></button>
      <button class="button-3d button-rect btn-yellow hover:scale-105 active:scale-95"></button>
      <button class="button-3d button-circle btn-pink hover:scale-105 active:scale-95"></button>
      <button class="button-3d button-square btn-gray hover:scale-105 active:scale-95"></button>
      <button class="button-3d button-rect btn-blue hover:scale-105 active:scale-95"></button>
      <button class="button-3d button-circle btn-green hover:scale-105 active:scale-95"></button>
      <button class="button-3d button-square btn-yellow hover:scale-105 active:scale-95"></button>
      <button class="button-3d button-rect btn-red hover:scale-105 active:scale-95"></button>
      <button class="button-3d button-circle btn-pink hover:scale-105 active:scale-95"></button>
      <button class="button-3d button-square btn-blue hover:scale-105 active:scale-95"></button>
      <button class="button-3d button-rect btn-gray hover:scale-105 active:scale-95"></button>
      <button class="button-3d button-circle btn-yellow hover:scale-105 active:scale-95"></button>
      <button class="button-3d button-square btn-green hover:scale-105 active:scale-95"></button>
      <button class="button-3d button-rect btn-pink hover:scale-105 active:scale-95"></button>
      <button class="button-3d button-circle btn-blue hover:scale-105 active:scale-95"></button>
      <button class="button-3d button-square btn-red hover:scale-105 active:scale-95"></button>
      
      <!-- Simulation Link To Stage Complete -->
      <a href="https://p.superdesign.dev/draft/69fa3a3a-b0d9-4736-b7cd-43c78c200356" id="simulate-win" class="button-3d button-rect btn-green hover:scale-105 active:scale-95 flex items-center justify-center">
        <iconify-icon icon="lucide:trophy" class="text-white"></iconify-icon>
      </a>
    </main>

    <!-- Persistent Footer Info Icon -->
    <div class="fixed bottom-8 right-8 z-50 group" style="view-transition-name: info-btn">
       <div class="absolute bottom-full right-0 mb-4 bg-black text-white p-4 rounded-2xl w-64 opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none shadow-2xl">
          <p class="text-xs leading-relaxed">
            Stage 3: 50 buttons, 5 correct paths. You are sharing this stage with 42 other active seekers. If the last button is found, the world resets to Stage 1.
          </p>
       </div>
       <button class="w-12 h-12 bg-white border border-gray-100 rounded-full flex items-center justify-center text-gray-400 hover:text-black hover:border-black transition-all shadow-sm">
          <iconify-icon icon="lucide:info" class="text-xl"></iconify-icon>
       </button>
    </div>

    <!-- Navigation (for testing) -->
    <nav class="fixed bottom-8 left-8 z-50 flex gap-2">
        <a href="https://p.superdesign.dev/draft/5e2d3bcc-e6c1-4fc8-9477-bde3bb9133a9" id="prev-stage" class="p-3 bg-white/80 backdrop-blur rounded-xl border border-gray-200 text-gray-500 hover:text-black transition-colors">
            <iconify-icon icon="lucide:chevron-left"></iconify-icon>
        </a>
        <a href="https://p.superdesign.dev/draft/69fa3a3a-b0d9-4736-b7cd-43c78c200356" id="next-stage" class="p-3 bg-white/80 backdrop-blur rounded-xl border border-gray-200 text-gray-500 hover:text-black transition-colors">
            <iconify-icon icon="lucide:chevron-right"></iconify-icon>
        </a>
    </nav>
  </div>
</body>
</html>
